name: sixyao

services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [front]
    mem_limit: 160m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      NODE_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: sixyao
      MYSQL_DATABASE: sixyao
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?数据库密码未配置}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?后台口令未配置}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      QUOTA_ENABLED: ${QUOTA_ENABLED:-true}
      WELCOME_CREDITS: ${WELCOME_CREDITS:-3}
      REWARD_CREDITS: ${REWARD_CREDITS:-1}
      REWARD_DAILY_LIMIT: ${REWARD_DAILY_LIMIT:-10}
      REWARD_PROVIDER: ${REWARD_PROVIDER:-disabled}
      CSJ_REWARD_SECURITY_KEY: ${CSJ_REWARD_SECURITY_KEY:-}
      MYSQL_CONNECTION_LIMIT: 6
      TRUST_PROXY: "true"
      REQUIRE_DATABASE: "true"
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      db:
        condition: service_healthy
    networks: [front, database]
    mem_limit: 640m
    stop_grace_period: 115s
    read_only: true
    tmpfs: [/tmp]
    logging: *logging

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sixyao
      MYSQL_USER: sixyao
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 node scripts/setup.cjs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 node scripts/setup.cjs}
      TZ: UTC
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=40
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    mem_limit: 1024m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  front:
  database:
    internal: true
